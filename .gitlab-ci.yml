include:
    - component: $CI_SERVER_FQDN/home-lab/automations/docker-compose-service-deployment@v2.0.5
      inputs:
          vm-hostname: infrastructure.vm.xbhl.intranet
          vm-ssh-username: $SSH_USER
          vm-ssh-private-key: $SSH_PRIVATE_KEY
          service-name: openwebui
          container-name: openwebui
          container-location: /opt/containers/openwebui
          cloudflare-dns-strategy: "direct"
          cloudflare-dns-entry-name: ai.intranet.xbhl.online
          cloudflare-zone-id: $CLOUDFLARE_ZONE_ID
          cloudflare-dns-api-token: $CLOUDFLARE_DNS_API_TOKEN
          container-healthcheck-delay: 60
          delete-existing-container-files: true

setup:generate-build-artifacts:
    script:
        - cp -r src/envs $BUILD_ARTIFACTS_DIR/
        # auth & admin
        - sed -i "s|^WEBUI_ADMIN_NAME=.*|WEBUI_ADMIN_NAME=${ADMIN_NAME}|" $BUILD_ARTIFACTS_DIR/envs/auth.env
        - sed -i "s|^WEBUI_ADMIN_EMAIL=.*|WEBUI_ADMIN_EMAIL=${ADMIN_EMAIL}|" $BUILD_ARTIFACTS_DIR/envs/auth.env
        - sed -i "s|^WEBUI_ADMIN_PASSWORD=.*|WEBUI_ADMIN_PASSWORD=${ADMIN_PASSWORD}|" $BUILD_ARTIFACTS_DIR/envs/auth.env
        - sed -i "s|^OAUTH_CLIENT_SECRET=.*|OAUTH_CLIENT_SECRET=${OPENWEBUI_OAUTH_CLIENT_SECRET}|" $BUILD_ARTIFACTS_DIR/envs/auth.env
        # ai api keys
        - sed -i "s|^OPENAI_API_KEYS=.*|OPENAI_API_KEYS=${OPENAI_API_KEY};${GOOGLE_API_KEY};${ANTHROPIC_API_KEY};${GROK_API_KEY};${OLLAMA_COM_API_KEY}|" $BUILD_ARTIFACTS_DIR/envs/ai.env
        - sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=${GOOGLE_API_KEY}|" $BUILD_ARTIFACTS_DIR/envs/ai.env
        - sed -i "s|^BRAVE_SEARCH_API_KEY=.*|BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}|" $BUILD_ARTIFACTS_DIR/envs/ai.env
        # s3 storage
        - sed -i "s|^S3_SECRET_ACCESS_KEY=.*|S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}|" $BUILD_ARTIFACTS_DIR/envs/storage.env
